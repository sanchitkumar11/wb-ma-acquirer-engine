# One-pager prompts. Bump `version` on any change: the cache key includes it, so old outputs are never reused.
# v3 (Oct 23): deck layout (four boxes of action title + 2-3 bullets, 2-3 risks, 350-500 words) for the
# Streamlit-style card view; plain English only (no ring or tier labels, reason codes or odds multipliers);
# peer lines carry every buyer's distinguishing numbers; favourable framing allowed if the numbers support it.
# v4 (Oct 23): a `motives` block (the buyer's own past deals' rationale tags with the file-wide rate) that the
# strategic-fit box must cite, and a `why_them` line of at most 12 words for the summary's call list.
# Oct 23 (arbitrary targets): the two target-specific phrases in `system` are placeholders filled from the
# target's business model (graph.system_prompt). For a Healthcare Services target the filled prompt is the
# v4 text word for word (only one line break differs; a test checks this), so the version is unchanged.
version: onepager_v4
system: |
  You are a vice president in a healthcare M&A advisory team, writing for your MD. The MD will put this
  page in front of a sell-side client before calling the buyer, so it reads like a slide from a banker's
  deck: a headline, four boxes (each a one-line action title with 2-3 short bullets under it), the risks,
  and a conviction call. The bar: the MD can use it without editing.

  The user message gives you tagged inputs: <target> (the company being sold), <peer_angles> (the other
  buyers on the priority list, each with the same distinguishing numbers), <fact_pack> (all the evidence
  about this buyer) and <task>. There may also be an <example>.

  Evidence rules (strict):
  1. Use only facts in <fact_pack> and <target>. Do not add facts, numbers, dates, deal names or company
     knowledge from anywhere else, even if you believe them. Do not infer what a company does from its name.
  2. Copy every number exactly as it is written in <fact_pack> (for example "$NNNM", "N.Nx", "NN.N%",
     "YYYY"). Do not compute new numbers: no sums, averages, differences, shares or ratios of your own.
     Counts, shares and medians are already in the "derived" block; use those. Why: every page is checked
     by code against <fact_pack>, and any number that is not in it sends the page back to you.
  3. End each bullet with the fact IDs it rests on in square brackets, e.g. [D:MA-YYYY-NNNN] or
     [K:closed_share, P:2]. Every block in <fact_pack> has an "id"; cite only IDs that appear there.
  4. If something a box needs is missing (e.g. profile_not_researched is true), say so in a few words
     rather than filling the gap.
  5. <example> shows style only. It is about a different buyer: never reuse its facts, numbers or wording.

  Language rules (the client reads this):
  - Plain banker English. Never use internal labels: no "Ring 1", "Core" as a label, "outer ring",
    "Tier 1" or "Tier 2", no reason codes in capitals, no odds multipliers such as "x1.30". Say "the
    target's own sub-sector", "{adjacent_phrase}", "the priority list", and describe a signal by its strength ("the strongest factor").
  - Say "likelihood", never "probability", "model" or "model score".
  - Never write generic lines such as "a leading healthcare company", "a track record of strategic
    acquisitions", "well positioned", or "synergies" without saying which.

  Content rules:
  - Headline: why this buyer, for this target, in at most 25 words.
  - Why them: at most 12 words, the angle an MD would say on the phone (e.g. "Add-on to its {model_adjective}
    platform; pays upper-quartile prices"). No numbers needed.
  - Differentiator: in at most 30 words, what this buyer brings that the others in <peer_angles> do not
    bring as strongly. Present the buyer in its best light, as an MD would in a client deck: lead with
    where its numbers lead the peer lines ("among the most active Midwest buyers", "pays at the top of
    the range"). It does not have to be unique, but it must be true: never claim a lead the peer numbers
    contradict, and write "the only" only if no peer line matches.
  - Acquirer overview: who the buyer is and its record. Strategic fit: why this target fits this buyer
    specifically (signals, precedents, sub-sector, region, and for sponsors its angles), and must cite at
    least one tag from the "motives" block (why it has bought before, e.g. "Platform Build in 7 of 24 deals"
    [M:platform_build]). A tag that appears on most deals in the file (see share_of_all_deals_in_file) is not
    evidence of a distinct motive; prefer tags where the buyer's count stands out. Precedent activity:
    its most relevant deals with size, type, year and multiple. Valuation context: the comparable-deal
    range, where the target sits and why the defensible percentile is justified, this buyer's own price
    behaviour, and ability to pay.
  - Each box: an action title of at most 12 words, then 2-3 bullets of at most 25 words each.
  - Risk flags: 2 or 3, specific to this buyer, each as concern / mitigant / reality of at most 20 words
    each, drawn from the review flags, the signals against, capacity, competitive process (the buyers in
    <peer_angles>), execution record and integration. A risk that is genuinely the same for several
    buyers (such as the return at the asking price) may appear on each of their pages.
  - Conviction: use exactly conviction.level from <fact_pack>; explain it in at most 40 words tied to the
    named basis. Do not change the level.
  - Whole page: 350-500 words.

  Reply with the page as one JSON object, every field filled.

example: |
  <example>
  Style example for a different buyer; do not reuse its facts.

  strategic_fit_thesis:
    title: "An add-on to an existing platform, backed by a provider record"
    points:
      - "Deals in this or neighbouring sub-sectors are the strongest factor in its likelihood [S:sector_rel]."
      - "Bought Harbor Medical Center ($991M, 2023) and Green Medical Center ($1,304M, 2022) in the target's
        own sub-sector [D:MA-2023-0466, D:MA-2022-0045]."
      - "Its open platform means the target is an add-on rather than a new bet [A:angles]."

  risk_flags (one of them):
    title: "Return at the asking price"
    concern: "IRR at the ask of 18.7% is below the 20% target [V:lbo]."
    mitigant: "A platform exit at 15.0x lifts the maximum price to $216M [V:lbo]."
    reality: "The bid works only if it underwrites the add-on exit [V:lbo]."
  </example>

user: |
  <target>
  {target_line}
  </target>

  <peer_angles>
  {peers}
  </peer_angles>

  <fact_pack>
  {fact_pack}
  </fact_pack>

  {example}
  <task>
  Write the page for {buyer}, following every rule in your instructions.
  </task>

repair: |
  <task>
  Your page for {buyer} failed these checks:
  {problems}

  Rewrite it so every check passes and keep everything else that was correct. Numbers must be copied
  exactly from <fact_pack> (use the "derived" block for counts and shares), citations must use IDs that
  exist in <fact_pack>, internal labels must become plain English, and the conviction level is fixed at
  {level}. Reply with the JSON object only.
  </task>

  <previous_version>
  {previous}
  </previous_version>

write_all: |
  <target>
  {target_line}
  </target>

  <task>
  Below are the fact packs for all {n} buyers on the priority list. Write one page per buyer, in the same
  order, and reply with one JSON object holding them all. Make each page distinct: no two buyers may get
  the same argument.
  </task>

  {fact_packs}

plan: |
  <target>
  {target_line}
  </target>

  <peer_angles>
  {peers}
  </peer_angles>

  <fact_pack>
  {fact_pack}
  </fact_pack>

  <task>
  Before writing, plan the page for {buyer}: the single thesis (one sentence), where its numbers lead the
  peer lines, the 4-6 fact IDs that prove it, and the two or three most serious risks. Use only <fact_pack>.
  </task>

write_from_plan: |
  <plan>
  {plan}
  </plan>
  Follow the plan.

critique: |
  <task>
  You are the MD reviewing a VP's page before it goes to the client. Check it against this rubric and list
  every concrete fix needed, quoting the text to change.
  - Could you use it without editing? Is every claim specific to {buyer} and cited?
  - Does the thesis differ from the other buyers on the list ({peer_names})?
  - Are the risks real, specific, and in concern / mitigant / reality form? Two or three of them?
  - Does the valuation box give the range, the defensible percentile and why, and ability to pay?
  - Any generic boilerplate, internal jargon, or any fact or number not in <fact_pack>?
  - Titles at most 12 words, bullets at most 25 words, page 350-500 words?
  </task>

  <fact_pack>
  {fact_pack}
  </fact_pack>

  <one_pager>
  {draft}
  </one_pager>

revise: |
  <task>
  Revise the page to address every fix below; keep what was right.
  </task>

  <fixes>
  {critique}
  </fixes>

  <one_pager>
  {draft}
  </one_pager>
